version: "3.9"

# Production overrides — add these to docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  redis:
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendfsync always
    restart: unless-stopped

  backend:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/staff/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
